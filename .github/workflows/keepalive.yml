# Pings your Supabase database every 3 days so the free project never counts as idle.
# Needs two repository secrets: SUPABASE_URL (https://xxxx.supabase.co) and SUPABASE_ANON_KEY (publishable key).
name: Supabase keepalive
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing secret. Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          curl -fsS -X POST "${SUPABASE_URL%/}/rest/v1/rpc/get_public_letter" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{"code":"keepalive"}'